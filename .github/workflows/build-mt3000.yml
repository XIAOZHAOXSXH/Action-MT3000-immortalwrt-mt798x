name: Build MT3000 Custom

on:
  workflow_dispatch:
  push:
    paths:
      - 'glmt3000.config'  # 当你更新配置文件时自动触发

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  TZ: Asia/Shanghai
  CONFIG_FILE: glmt3000.config  # 这里对应你上传的文件名

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        # 将仓库根目录下的配置文件复制到编译目录
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && mv $GITHUB_WORKSPACE/$CONFIG_FILE openwrt/.config
        cd openwrt
        # 扩展配置，补全依赖
        make defconfig

    - name: Force Argon Theme as Default
      run: |
        cd openwrt
        # 1. 修改默认主题设置 (通过修改 default-settings 或者直接修改 luci 配置文件)
        # 这里使用比较通用的修改 feeds 中 luci-base 的方式，确保编译出的固件默认就是 argon
        sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile
        sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/modules/luci-base/root/etc/config/luci

        # 2. 如果源码中有 default-settings 包，也尝试修改 (双重保险)
        find package/ -name "default-settings" | xargs -r sed -i 's/luci-theme-bootstrap/luci-theme-argon/g'
        
        # 3. 再次确认 .config 中 Argon 被选中
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        # 确保 Bootstrap 没被强制选中 (可选)
        # echo "# CONFIG_PACKAGE_luci-theme-bootstrap is not set" >> .config
        
        # 重新生成 defconfig 以应用修改
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v3
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_MT3000_F50_Argon
        path: ${{ env.FIRMWARE }}