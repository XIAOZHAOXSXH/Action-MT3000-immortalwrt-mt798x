name: Build ImmortalWrt for GL-MT3000

on:
  # 只在 Actions 页面手动运行时编译。
  #
  # 这里刻意不挂 push 触发：手动触发时可以勾插件，push 触发拿到的是默认参数
  # （都不勾），编出来的是基础固件。两者并存的话，每次改完脚本推上去会先自动
  # 跑一次无插件的，再手动跑一次带插件的，同样的源码白编两遍，各 1.5～2 小时。
  workflow_dispatch:
    inputs:
      build_openclash:
        description: '编译 OpenClash'
        type: boolean
        default: false
      build_passwall:
        description: '编译 PassWall'
        type: boolean
        default: false
      upload_release:
        description: '把固件上传到 Release'
        type: boolean
        default: true

# Release 需要一个写权限的 token
permissions:
  contents: write

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  CONFIG_FILE: glmt3000.config
  TZ: Asia/Shanghai
  # 出厂 LAN 地址，与 scripts/set-default-lan.sh 保持一致
  LAN_IP: 192.168.8.1
  LAN_MASK: 255.255.255.0
  LAN_PREFIX: '24'

jobs:
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GL-MT3000
            config: glmt3000.config

    steps:
      # ------------------------------------------------------------------
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -h /

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          # 原先用的 git.io 短链已经失效，这里直接列依赖
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 \
            python3 python3-pyelftools libpython3-dev qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

      - name: 拉取 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      # ------------------------------------------------------------------
      # 缓存：ccache 与 dl 目录能把重复编译从 2 小时压到 30 分钟左右
      # ------------------------------------------------------------------
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-

      - name: 缓存下载目录
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-${{ matrix.name }}-${{ hashFiles('build/**') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ matrix.name }}-

      - name: 准备 ccache 目录
        run: |
          mkdir -p /workdir/.ccache
          echo "CCACHE_DIR=/workdir/.ccache" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      - name: 准备插件与 feeds（按开关）
        run: |
          chmod +x scripts/*.sh
          # 脚本内部会：feeds update -a → feeds install -a（官方全量）
          # → 写入 .extra-deps → 需要时引入 OpenClash。
          # 全部使用官方 feeds，不引入第三方源。
          ./scripts/prepare-packages.sh /workdir/openwrt \
            "${{ inputs.build_openclash || 'false' }}" \
            "${{ inputs.build_passwall || 'false' }}"

      - name: 载入配置
        working-directory: /workdir/openwrt
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # 追加插件开关（如果有）
          if [ -s .extra-deps ]; then
            echo "--- 追加插件配置 ---"
            cat .extra-deps >> .config
          fi

          # 把 Argon 主题设为默认，避免装完还是 bootstrap
          sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          grep -rl "luci-theme-bootstrap" package/ 2>/dev/null | xargs -r sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' || true
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config

          # 开 ccache（目录由上一个步骤准备好并缓存）
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_CCACHE_DIR=\"/workdir/.ccache\"" >> .config

          # 落一份 defconfig 日志，下一步核对失败时用它定位原因
          make defconfig 2>&1 | tee /tmp/defconfig.log

      - name: 把出厂 LAN 地址改为 192.168.8.1
        run: |
          ./scripts/set-default-lan.sh /workdir/openwrt

      # 这一步是硬断言：.extra-deps 里要求的包，defconfig 之后必须仍然是 =y。
      #
      # 之前几轮的白跑都是同一个模式：某个包装不上，defconfig 静默把它丢掉，
      # 然后继续编 40 分钟，最后在 package/install 阶段才报
      # "cannot find dependency xxx"。这里把它提前到十几分钟内暴露，
      # 并且把排查所需的信息一次打全（符号表定义、是否被 feeds 展开、defconfig 告警）。
      - name: 核对最终配置
        working-directory: /workdir/openwrt
        run: |
          echo "===== 目标设备 ====="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config || true
          echo

          if [ ! -s .extra-deps ]; then
            echo "本次没有勾选插件，跳过包断言"
            exit 0
          fi

          echo "===== 请求的包是否真的进了固件 ====="
          missing=""
          for p in $(sed -nE 's/^CONFIG_PACKAGE_([A-Za-z0-9_.+-]+)=y$/\1/p' .extra-deps); do
            if grep -qE "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "  [OK]   $p"
            else
              echo "  [MISS] $p"
              missing="$missing $p"
            fi
          done

          if [ -n "$missing" ]; then
            echo
            echo "########## 有包被 defconfig 丢弃，提前失败，不浪费 40 分钟编译 ##########"
            for p in $missing; do
              echo
              echo "----- ${p}：是否被 feeds install 展开到 package/feeds -----"
              # 注意这里的 || true：包没展开时 ls 会失败，而 run 是 bash -e，
              # 不加兜底会直接中断脚本，恰好把最需要的诊断信息吞掉。
              found=$(ls -d package/feeds/*/"${p}" 2>/dev/null | head -1 || true)
              if [ -n "$found" ]; then
                echo "  已展开: $found"
              else
                echo "  没有展开！说明 feeds install 没成功，该包根本不在构建树里"
              fi
              echo "----- ${p}：Kconfig 符号定义 -----"
              if grep -qE "^config PACKAGE_${p}\$" tmp/.config-package.in; then
                grep -A8 -E "^config PACKAGE_${p}\$" tmp/.config-package.in | head -12 || true
              else
                echo "  符号 PACKAGE_${p} 不存在于符号表"
              fi
              echo "----- ${p}：defconfig 阶段的告警 -----"
              grep -iE "(^|[^a-z])${p}([^a-z]|$)" /tmp/defconfig.log | head -8 || true
            done
            echo
            echo "----- 无类型符号告警（常见于包定义残缺）-----"
            grep -n "defined without type" /tmp/defconfig.log | head -5 || true
            exit 1
          fi

          echo
          echo "全部请求的包均已启用。"

      - name: 下载源码包
        working-directory: /workdir/openwrt
        run: |
          make download -j8 || make download -j1 V=s
          # 清掉明显是错误页面的小文件
          find dl -size -1024c -exec ls -l {} \; || true
          find dl -size -1024c -exec rm -f {} \; || true

      - name: 编译固件
        working-directory: /workdir/openwrt
        run: |
          echo "使用 $(nproc) 线程编译"
          # -j 失败时回落到单线程并输出详细日志，方便定位
          make -j"$(nproc)" || make -j1 V=s

      - name: 整理产物
        id: organize
        run: |
          # 跳出 target 目录，删除 packages 子目录（单独打 ipk 用不到）
          cd /workdir/openwrt/bin/targets/*/*/
          rm -rf packages

          # 生成校验文件
          sha256sum ./* > sha256sums.txt 2>/dev/null || true

          echo "FIRMWARE_DIR=$PWD" >> "$GITHUB_ENV"
          echo "TARGET_NAME=$(basename $(dirname $PWD))-$(basename $PWD)" >> "$GITHUB_ENV"

          echo "===== 产物列表 ====="
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ env.TARGET_NAME }}${{ inputs.build_openclash && '-OpenClash' || '' }}${{ inputs.build_passwall && '-PassWall' || '' }}
          path: ${{ env.FIRMWARE_DIR }}
          compression-level: 9
          retention-days: 30

      # ------------------------------------------------------------------
      # Release：用时间戳做 tag，避免覆盖历史版本
      # ------------------------------------------------------------------
      - name: 上传到 Release
        if: inputs.upload_release && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ env.TARGET_NAME }}
          name: ${{ env.TARGET_NAME }} 自动编译 #${{ github.run_number }}
          body: |
            ## ImmortalWrt for GL-MT3000

            自动编译产物，源码基于 [hanwckf/immortalwrt-mt798x](https://github.com/hanwckf/immortalwrt-mt798x) 的 `openwrt-21.02` 分支。

            | 项目 | 值 |
            | --- | --- |
            | 设备 | GL.iNet GL-MT3000 (MT7981) |
            | 管理地址 | `192.168.8.1` |
            | OpenClash | ${{ inputs.build_openclash && '已编译' || '未编译' }} |
            | PassWall | ${{ inputs.build_passwall && '已编译' || '未编译' }} |
            | 构建编号 | #${{ github.run_number }} |
            | 提交 | ${{ github.sha }} |

            ### 文件说明

            | 文件 | 用途 |
            | --- | --- |
            | `*sysupgrade.bin` | 系统内升级 / 保留配置刷写 |
            | `*factory.bin` | U-Boot 首次刷入（恢复出厂） |
            | `sha256sums.txt` | 校验值 |

            ### 刷写提醒

            从 GL.iNet 原厂固件切换过来时，原厂 U-Boot 校验厂商信息，需要在 Uboot 里走 recovery 模式刷 `factory.bin`。已经刷过 ImmortalWrt 的直接用 `sysupgrade.bin` 升级即可。
          files: |
            ${{ env.FIRMWARE_DIR }}/*
          draft: false
          prerelease: false
          generate_release_notes: false
