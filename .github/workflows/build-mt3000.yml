name: Build MT3000 Custom

on:
  workflow_dispatch:
  push:
    paths:
      - 'glmt3000.config'  # 当你更新配置文件时自动触发

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  TZ: Asia/Shanghai
  CONFIG_FILE: glmt3000.config

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4  # 这里建议也顺手升到 v4，虽然 v3 还能用

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        # 将仓库根目录下的配置文件复制到编译目录
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && mv $GITHUB_WORKSPACE/$CONFIG_FILE openwrt/.config
        cd openwrt
        # 扩展配置，补全依赖
        make defconfig

    - name: Force Argon Theme as Default
      run: |
        cd openwrt
        
        # 1. 修改 Feeds 中的默认配置
        sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile
        sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/modules/luci-base/root/etc/config/luci

        # 2. 修复报错的核心步骤：
        # 使用 grep -rl 查找包含目标字符串的所有文件，只对文件进行 sed 替换
        # 这样可以完美避开 "default-settings" 这种目录名
        grep -rl "luci-theme-bootstrap" package/ | xargs -r sed -i 's/luci-theme-bootstrap/luci-theme-argon/g'
        
        # 3. 再次确认 .config 中 Argon 被选中
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        
        # 重新生成 defconfig 以应用修改
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4  # <--- 这里是修复的关键点，必须是 v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_MT3000_F50_Argon
        path: ${{ env.FIRMWARE }}
        compression-level: 9 # v4 新增参数，最高压缩比