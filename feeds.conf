# Third-party feed: PassWall and its proxy cores (sing-box / xray-core /
# hysteria / geoview / tcping ...). Upstream xiaorouji/openwrt-passwall is
# no longer reachable; kenzok8/small is an actively synced mirror.
# The source is large and mixes packages that only target 22.03/23.05
# (clashoo, nikki, momo ...). Installing everything makes include/scan.mk
# pull them all into the Kconfig symbol table, which triggers recursive
# dependency and segfaults openwrt. scripts/prepare-packages.sh prunes the
# tree after `feeds update`, keeping only what is needed.
# NOTE: keep comments ASCII-only, and never write a bare "#" line.
# scripts/feeds strips comments with s/#.+$// which needs at least one
# byte after the hash; a lone "#" survives the strip, fails the src-
# regex and aborts with "Syntax error". Non-ASCII comments are also
# risky because that regex works on bytes, not characters.
src-git small https://github.com/kenzok8/small.git;master

# OpenClash is not listed here: its repo root also contains img/ and other
# non-package directories, which makes scripts/feeds fail to parse it.
# scripts/prepare-packages.sh clones it and copies luci-app-openclash into
# package/ instead.
