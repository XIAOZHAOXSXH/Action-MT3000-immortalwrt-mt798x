# ---- 第三方插件源 ----
# PassWall 及其代理内核（sing-box / xray-core / hysteria / geoview / tcping 等）。
# 原版 xiaorouji/openwrt-passwall 已无法访问，kenzok8/small 是持续同步的镜像。
#
# 注意：这个源体量很大，混有只适配 22.03/23.05 的包（clashoo、nikki、momo 等）。
# 全量 install 会让 include/scan.mk 把它们全部扫进符号表，触发 Kconfig 递归依赖
# 并段错误。scripts/prepare-packages.sh 在 update 之后会裁剪目录，只保留需要的。
src-git small https://github.com/kenzok8/small.git;master

# OpenClash 不放在这里：仓库根目录还有 img/ 等非包目录，src-git 会让 feeds 解析失败。
# 由 scripts/prepare-packages.sh 单独 clone 后把 luci-app-openclash 拷进 package/。
